background:#efc96c;z-index:2}.gift.open .lid{transform:translate(-28px,-55px) rotate(-22deg)}.gift.open .ribbon{opacity:.3}.diploma{background:#f8efd4;color:#3d2a2a;border:9px double #b58b3b;padding:28px;border-radius:8px}.diploma h2{color:#5d351f}.secret{position:absolute;min-width:52px;min-height:52px;border:0;border-radius:50%;background:#ffffff12;color:#ffd875;font-size:1.5rem}.modal{position:fixed;inset:0;background:#080712d9;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.modalbox{max-width:520px;width:100%;background:#291b35;border:1px solid #f2cf7d66;border-radius:25px;padding:28px;text-align:center}.hint{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:45;background:#fff3d8;color:#351c25;padding:12px 18px;border-radius:20px;display:none;box-shadow:0 0 30px #ffd88577}.hint.on{display:block;animation:pulse 1s infinite}.back{margin-top:20px}.debug{position:fixed;left:5px;bottom:5px;z-index:100;background:#111e;color:#fff;padding:8px;max-width:96vw;display:none}.debug.on{display:block}.debug button{margin:2px}.muted{opacity:.72}.opened::after{content:'✓ открыто';display:block;color:#aee9bb;font-size:.76rem;margin-top:5px}.favorite::before{content:'♥';color:#ffb0bf;position:absolute;right:12px;bottom:10px}.returning{color:#ffd68c}.error{display:none;position:fixed;inset:0;z-index:200;background:#160f20;padding:30px;align-items:center;justify-content:center;text-align:center}.error.on{display:flex}@keyframes enter{from{opacity:0;transform:translateY(15px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@keyframes pulse{to{transform:scale(1.06)}}@keyframes flicker{to{transform:scale(.88) rotate(5deg)}}@keyframes twinkle{to{opacity:.45;transform:scale(.75)}}@media(max-width:420px){.scene{padding-left:14px;padding-right:14px}.glass{padding:20px 16px}.tree{height:390px}.toolbar{top:auto;bottom:max(10px,env(safe-area-inset-bottom));right:50%;transform:translateX(50%)}.progress{top:8 </style></head><body><canvas id="fx"></canvas><div id="progress" class="progress"></div><div id="toolbar" class="toolbar"><button class="tool" data-act="sound" aria-label="звук">♪</button><button class="tool" data-act="font" aria-label="размер текста">А+</button><button class="tool" data-act="calm" aria-label="спокойный режим">◌</button></div><main id="app"><section class="scene on"><div class="wrap glass"><div class="eyebrow">только для тебя</div><h1>сегодня особенный день…</h1><p>И для тебя кое-что приготовили. Ничего устанавливать не нужно — просто нажимай на кнопки.</p><button class="btn" data-act="openSound">открыть подарок ❤️</button><button class="btn alt" data-act="openSilent">открыть без звука</button></div></section></main><div id="modal" class="modal"><div class="modalbox"><div id="modalText"></div><button class="btn" data-act="closeModal">хорошо ❤️</button></div></div><div id="hint" class="hint">☝ нажми на светящуюся кнопку</div><div id="debug" class="debug"></div><div id="error" class="error"><div><h2>Подарок немного запутался</h2><p>Но самое главное: с днём рождения! Ты очень дорога нам. ❤️</p><button class="btn" data-act="reload">попробовать снова</button></div></div><noscript><div style="padding:30px;color:white">С днём рождения, бабушка! ❤️ Для открытия интерактивного подарка нужно разрешить JavaScript в браузере.</div></noscript><script>

const CONFIG={"grandmaName": "бабушка", "fromName": "Дмитрий", "age": "73", "likes": ["дача", "цветы"], "replyLink": "", "family": [], "photos": [], "voice": "", "coupons": ["Приехать с чем-нибудь вкусным", "Позвонить и болтать сколько захочется", "Помочь разобраться с телефоном", "Вместе пересмотреть старые фотографии", "Помочь с делами на даче", "Устроить совместное чаепитие", "Выполнить одно небольшое желание", "Просто приехать и провести время вместе"], "mainGreeting": "Бабушка, с днём рождения! Я очень хочу, чтобы сегодня у тебя было побольше поводов улыбаться и поменьше причин куда-то спешить. Спасибо тебе за заботу, за терпение, за наши разговоры и за то особенное чувство дома, которое появляется рядом с тобой. Я желаю тебе крепкого здоровья, спокойствия, лёгкости и много хороших дней — таких, когда всё складывается удачно, близкие рядом, на душе тепло, а впереди есть что-то приятное. Пусть любимая дача радует, цветы красиво растут и цветут, а времени на отдых становится больше. Пусть тебе чаще звонят не по делам, а просто потому, что соскучились. И пусть каждый день напоминает: ты очень важна для нас. Этот маленький подарок я сделал специально для тебя. Здесь можно нажимать почти на всё, открывать пожелания, искать сюрпризы и просто немного отвлечься. Надеюсь, он подарит тебе улыбку. С праздником тебя! ❤️", "finalLetter": "Бабушка, если ты дошла до этого места, значит, ты уже открыла почти весь мой маленький подарок. Я хотел сделать для тебя не просто открытку с несколькими словами, а что-то, что можно спокойно посмотреть, понажимать, улыбнуться и, может быть, сохранить. Спасибо тебе за то, сколько тепла ты даёшь нашей семье. Очень многое кажется обычным только потому, что мы привыкли: к твоей заботе, к твоим словам, к тому, что ты всегда переживаешь за близких и стараешься помочь. Но на самом деле всё это очень ценно. Я хочу, чтобы и о тебе заботились так же. Чтобы у тебя было время отдыхать, заниматься тем, что нравится, радоваться цветам и даче, встречаться с родными и не торопиться. Пусть впереди будет много спокойных, светлых дней, хороших новостей, семейных встреч и маленьких приятных событий. Пусть рядом всегда будут люди, которым можно позвонить в любое время. А если иногда мы не говорим вслух всё, что чувствуем, знай: ты для меня очень родной и важный человек. Спасибо за всё, чему ты научила, за поддержку и за самую простую, но важную вещь — за ощущение семьи. Я очень хочу, чтобы этот день запомнился тебе хорошим настроением. С днём рождения, бабушка. Будь счастлива. И обязательно береги себя. Люблю тебя. Твой Дмитрий."};

const AudioFx={ctx:null,master:null,init(){try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();this.master=this.master||this.ctx.createGain();this.master.gain.value=.08;this.master.connect(this.ctx.destination);this.ctx.resume()}catch(e){}},tone(f,d=.18,type='sine',v=.7){if(!state.sound)return;this.init();if(!this.ctx)return;let o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.02)},bell(){this.tone(880,.35,'sine',.5);setTimeout(()=>this.tone(1320,.3,'sine',.3),80)},whoosh(){this.tone(220,.12,'triangle',.18)},song(){[392,392,440,392,523,494,392,392,440,392,587,523].forEach((n,i)=>setTimeout(()=>this.tone(n,.28,'sine',.35),i*230))}};
let canvas=$('#fx'),ctx=canvas&&canvas.getContext?canvas.getContext('2d'):null,particles=[],raf=0;function resize(){if(!canvas||!ctx)return;let d=Math.min(window.devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);
function burst(x,y,n=50){if(!ctx)return;if(state.calm||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))n=Math.min(n,12);let cap=(navigator.hardwareConcurrency||4)<=4?80:160;n=Math.min(n,cap);for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.8)*8,g:.09,life:50+Math.random()*50,r:2+Math.random()*4,h:Math.random()*60+330});if(!raf)loop()}
function loop(){raf=requestAnimationFrame(loop);ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life-->0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=`hsl(${p.h} 85% 72%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});ctx.globalAlpha=1;if(!particles.length){cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,innerWidth,innerHeight)}}document.addEventListener('visibilitychange',()=>{if(document.hidden&&raf){cancelAnimationFrame(raf);raf=0}else if(particles.length&&!raf)loop()});
function resetProgress(){state.opened=[];state.found=[];state.favorites=[];state.flower=[];state.noteOrder=[];state.predOrder=[];state.noteI=state.predI=0;state.returning=false;save()}
document.addEventListener('click',e=>{resetHint();let fav=e.target.closest('[data-fav]');if(fav){e.preventDefault();e.stopPropagation();let x=fav.dataset.fav;state.favorites=state.favorites.includes(x)?state.favorites.filter(v=>v!==x):state.favorites.concat(x);save();render('hub');return}let b=e.target.closest('button,[data-act]');if(!b)return;try{if(b.dataset.nav){nav(b.dataset.nav);return}let a=b.dataset.act;if(a==='openSound'){state.sound=true;AudioFx.init();AudioFx.song();nav('gift')}if(a==='openSilent'){state.sound=false;nav('gift')}if(a==='gift'){b.classList.add('open');burst(innerWidth/2,innerHeight/2,110);if(navigator.vibrate)navigator.vibrate(40);setTimeout(()=>nav('greeting'),1000)}if(a==='closeModal')modal.classList.remove('on');if(a==='sound'){state.sound=!state.sound;if(state.sound){AudioFx.init();AudioFx.bell()}save()}if(a==='font'){state.font=(state.font+1)%3;document.documentElement.style.setProperty('--fs',[18,20,22][state.font]+'px');save()}if(a==='calm'){state.calm=!state.calm;document.body.classList.toggle('calm',state.calm);save()}if(a==='note'){if(!state.noteOrder.length||state.noteI>=state.noteOrder.length){state.noteOrder=shuffle(DATA.notes.map((_,i)=>i));state.noteI=0}$('#note').textContent=DATA.notes[state.noteOrder[state.noteI++]];save()}if(a==='predict'){if(!state.predOrder.length||state.predI>=state.predOrder.length){state.predOrder=shuffle(DATA.preds.map((_,i)=>i));state.predI=0}$('#prediction').textContent=DATA.preds[state.predOrder[state.predI++]];save()}if(a==='blow'){let c=$('#cake');c.classList.add('out');$('#cakeText').textContent='Свечи погасли. Теперь обязательно загадай желание ❤️';burst(innerWidth/2,innerHeight*.45,70);AudioFx.tone(180,.5,'triangle',.2)}if(a==='wished'){$('#wishText').innerHTML='<b>пусть обязательно сбудется ✨</b>';burst(innerWidth/2,innerHeight*.45,120)}if(a==='heart'){burst(innerWidth/2,innerHeight*.45,100);b.style.transform='scale(.65)';setTimeout(()=>b.style.transform='',500)}if(a==='fireworks'){for(let i=0;i<4;i++)setTimeout(()=>burst(Math.random()*innerWidth,100+Math.random()*innerHeight*.45,60),i*350)}if(a==='restart'){resetProgress();nav('start')}if(a==='reload')location.reload();if(a==='reply'){let text='Спасибо, мне очень понравилось ❤️';if(navigator.share)navigator.share({text}).catch(()=>{});else location.href=CONFIG.replyLink}if(a==='nextPhoto'){let imgs=CONFIG.photos,cur=Number($('#gallery').dataset.i||0),n=(cur+1)%imgs.length;$('#gallery').dataset.i=n;$('#photo').src=imgs[n].src;$('#caption').textContent=imgs[n].caption||''}if(a==='voice'){let au=new Audio(CONFIG.voice);au.play().catch(()=>showMsg('Не получилось запустить голосовое на этом устройстве.'))}
if(b.dataset.reveal){b.classList.add('revealed');b.innerHTML=`<p>${esc(b.dataset.reveal)}</p>`}if(b.dataset.msg)showMsg(b.dataset.msg);if(b.dataset.petal!==undefined){let i=+b.dataset.petal;if(!state.flower.includes(i))state.flower.push(i);b.classList.add('revealed');$('#flowerText').textContent=b.dataset.msg;if(state.flower.length===8){$('#flowerText').textContent='Все лепестки открыты. Пусть всё это обязательно будет в твоей жизни ❤️';burst(innerWidth/2,innerHeight*.5,100)}save()}if(b.dataset.coupon!==undefined){b.classList.add('revealed');b.innerHTML+=`<div style="color:#ffd17b;font-weight:900;transform:rotate(-5deg)">АКТИВИРОВАНО ✓</div>`;AudioFx.bell()}if(b.dataset.secret!==undefined){let n=+b.dataset.secret;if(!state.found.includes(n)){state.found.push(n);save();burst(b.getBoundingClientRect().left+25,b.getBoundingClientRect().top+25,45)}showMsg(DATA.secrets[n]+(state.found.length===5?' Ты нашла все пять сюрпризов! ❤️':''));b.style.opacity=.35;updateProgress()}}catch(err){console.error(err)}});
window.onerror=function(){try{$('#error').classList.add('on')}catch(e){};return false};
if(location.hash==='#debug'||location.hash.startsWith('#debug')){let d=$('#debug');d.classList.add('on');d.innerHTML='<b>DEBUG</b> '+['start','gift','greeting','hub',...sceneList,'final'].map(x=>`<button data-nav="${x}">${x}</button>`).join('')+'<button data-act="restart">RESET</button>'}
addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(id&&id!=='debug'&&(['start','gift','greeting','hub','final'].concat(sceneList)).includes(id)&&state.scene!==id)render(id)});
document.body.classList.toggle('calm',state.calm);document.documentElement.style.setProperty('--fs',[18,20,22][state.font||0]+'px');let first=state.returning?'start':'start';render(first);resetHint();
})();</script></body></html>
